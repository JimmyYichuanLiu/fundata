server {
    listen 80;
    server_name 150.158.79.213;

    # Gzip 压缩（3Mbps 带宽下很有价值）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # React 静态文件根目录
    root /opt/fundata/web/dist;
    index index.html;

    # HTTP 公网只读门禁。未来启用 HTTPS 管理端时需使用单独审核的配置。
    # 安装后保留在 nginx 配置中，不随应用 Git 回滚移除。
    location ~ ^/api/(auth/(login|logout)|admin|failures|sync/history|export)(/|$) {
        return 403;
    }

    # API 反向代理 → uvicorn；同源只读不需要跨域 OPTIONS。
    location /api/ {
        limit_except GET HEAD { deny all; }
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 公网不提供调试文档。
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    # React Router SPA 兜底：所有未匹配路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
